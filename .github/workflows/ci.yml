name: CI

on:
  push:
    branches: [main]
  # A draft runs only the quick checks; marking it ready for review runs the
  # rest, and so does every push after that. `Full CI` is the required check.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # A draft and a ready pull request have groups of their own. A draft pushed
  # and marked ready a moment later starts two runs, and in one group the later
  # queued cancels the other, which can leave `Full CI` unreported. A push to
  # `main` gets a group of its own, so a later push never cancels its verdict.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.pull_request.draft && 'draft' || 'ready') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # `scripts/ci-changes.ts` says what a pull request or a push to `main` can
  # affect. A skipped job satisfies a required check; a workflow filtered out
  # by `paths` would leave it pending, hence jobs and not a filter. A push is
  # classified only when the commit before it had a green run of this
  # workflow, which the script asks the API for, hence `actions: read`.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tests: ${{ steps.classify.outputs.tests }}
      proof: ${{ steps.classify.outputs.proof }}
      plugins: ${{ steps.classify.outputs.plugins }}
      full: ${{ steps.classify.outputs.full }}
      scope: ${{ steps.classify.outputs.scope }}
      bundles: ${{ steps.classify.outputs.bundles }}
      node: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.ts
      # The Node the connector host carries. Every job that runs on it reads it
      # from here, so `host/node.json` is the only place it is written.
      - id: pin
        run: echo "version=$(node -p "require('./host/node.json').version")" >> "${GITHUB_OUTPUT}"

  # Every file is formatted and read for personal details, so a change to
  # documentation runs those two, on the root's own dependencies, which need
  # no monorepo. Checks is the quick job: when it fails on a pull request,
  # `stop` ends the slow ones.
  checks:
    name: Checks
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ needs.changes.outputs.code == 'false' }}
        run: pnpm install --frozen-lockfile --filter .
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm build
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm connectors:check
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm typecheck
      - if: ${{ needs.changes.outputs.code != 'false' }}
        run: pnpm lint
      - run: pnpm format:check
      - if: ${{ needs.changes.outputs.code == 'false' }}
        run: pnpm exec vitest run scripts/test/tree.test.ts

  # The unit tests, in shards that each run a share of the test files, on the
  # oldest Node the connector runtime supports and on the Node the connector
  # host carries (`host/node.json`). A change to one connector alone runs that
  # connector's tests (`scope`); anything else runs them all. A test that fails
  # runs once more and is reported.
  tests:
    name: Tests ${{ matrix.shard }}/3 on ${{ matrix.node == 'pinned' && 'the pinned Node' || format('Node {0}', matrix.node) }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' && (needs.changes.result != 'success' || needs.changes.outputs.tests != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        node: [22, pinned]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node == 'pinned' && needs.changes.outputs.node || matrix.node }}
          cache: pnpm
      - run: scripts/monorepo.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          SHARD: ${{ matrix.shard }}/3
        run: |
          paths=()
          if [ -n "${SCOPE}" ] && [ "${SCOPE}" != all ]; then
            read -r -a paths <<<"${SCOPE}"
          fi
          pnpm exec vitest run --shard "${SHARD}" --passWithNoTests "${paths[@]}"

  # Each shard boots the pinned release server of its own and runs the groups
  # `scripts/proof/shards.ts` gives it, so a scenario runs in exactly one.
  proof:
    name: Proof ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.proof != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: scripts/monorepo.sh
      - run: scripts/monorepo.sh hooks
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm proof --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # Judges each plugin's source folder as installing it will, with the pinned
  # `marfa` and no server. It needs no dependencies, so it installs none.
  plugins:
    name: Plugins
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.plugins != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: scripts/monorepo.sh
      - run: node --experimental-strip-types scripts/check-plugins.ts

  # Bundles each connector into the one file the connector host runs, then runs
  # them on the Node the host carries (`host/node.json`) as the host will:
  # under the permission flags, with `--help` from an empty folder, and the RSS
  # group of the proof from its bundle, which reaches the network and
  # the server. The build and the bundles run on that Node, so the bundles are
  # checked on the runtime they are made for.
  bundles:
    name: Bundles
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.bundles != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.changes.outputs.node }}
          cache: pnpm
      - run: scripts/monorepo.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle every connector
        run: node --experimental-strip-types scripts/bundle-connectors.ts --version 0.0.0 --out "${RUNNER_TEMP}/bundles"
      - name: Run each bundle's --help under the permission flags
        run: node --experimental-strip-types scripts/check-bundles.ts "${RUNNER_TEMP}/bundles"
      - name: Run the RSS proof group from its bundle
        env:
          PROOF_BUNDLES: ${{ runner.temp }}/bundles
        run: pnpm proof --group rss

  # On a pull request, a failed `Checks` ends the run: the slow jobs would only
  # finish a verdict that is red already. It never runs on `main`, where every
  # job reports. The cancel ends this job too, which is why `gate` does not
  # wait for it.
  stop:
    name: Stop the slow jobs
    needs: checks
    if: ${{ always() && github.event_name == 'pull_request' && needs.checks.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run cancel "${GITHUB_RUN_ID}"

  # The one required check. A skipped job passes a required check, and a draft
  # skips the tests, `Proof`, `Plugins` and `Bundles`, so on a draft this job is named `Draft
  # CI`: the required `Full CI` stays expected, which blocks a merge, until the
  # run that marking the pull request ready starts has finished every job.
  # It runs after a failed job and fails then. A cancelled run skips it, and a
  # skipped job never reports as `Full CI`, so a cancel cannot leave it green.
  # The exception is the cancel `stop` makes after a failed `Checks`: the gate
  # still runs then, and fails, so `Full CI` is red and not cancelled.
  gate:
    name: ${{ github.event.pull_request.draft && 'Draft CI' || 'Full CI' }}
    needs: [changes, checks, tests, proof, plugins, bundles]
    if: ${{ !cancelled() || needs.checks.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "::error::A job failed or was cancelled: ${RESULTS}"
              exit 1
              ;;
          esac
