name: Follow Node releases

# Keeps the Node release the connector host carries on the newest release of
# its major version: once a day, and by hand. When nodejs.org lists a newer
# release of the same major version and no open pull request changes
# `host/node.json`, the run writes the pin for it, from that release's
# `SHASUMS256.txt` after checking the signature on it against the Node.js
# release keys, and opens a pull request that merges when the repository's
# checks pass. A new major version is a change made by hand, and a
# pre-release is never proposed.
#
# The first job holds no secret and hands the change to the second as a patch.
# The second refuses a patch that touches anything but `host/node.json`, and
# opens the pull request as the WithMarfa Bot app, since the checks on a pull
# request that the GitHub token opens wait for someone to approve them. The
# app's token is limited to contents and pull requests, and made only once
# nothing else in the job runs.
#
# A by-hand run is a dry run unless `dry_run` is turned off: it decides and
# moves the file in the run and pushes nothing.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Decide and write the pin in this run, without pushing or opening a pull request
        type: boolean
        default: true

concurrency:
  group: follow-node
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  BRANCH: automation/node-release
  REAL_RUN: ${{ github.event_name == 'schedule' || !inputs.dry_run }}

jobs:
  bump:
    name: Move to the newest Node release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bump: ${{ steps.decide.outputs.bump }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      # A dry run may come from any branch, since it pushes nothing.
      - name: Refuse any branch but main
        if: ${{ env.REAL_RUN == 'true' }}
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "::error::The host follows Node from main only, and this run is on ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(jq -r .version host/node.json)"
          versions="$(curl -fsS https://nodejs.org/dist/index.json | jq -r '.[].version')"
          open="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 1000 --json files \
            --jq '[.[] | select(any(.files[]; .path == "host/node.json"))] | length')"
          result="$(scripts/follow-node.sh decide "current=${current}" "versions=${versions}" "open=${open}")"
          echo "${result}"
          if [[ "${result}" == "bump "* ]]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "version=${result#bump }" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "${result}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.decide.outputs.bump == 'true' }}
        with:
          node-version: 24

      # Fails unless a Node.js release key signed the release's SHASUMS256.txt.
      - name: Write the pin
        if: ${{ steps.decide.outputs.bump == 'true' }}
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: node scripts/node-pin.ts update "${VERSION}"

      - name: Hand over the change
        if: ${{ steps.decide.outputs.bump == 'true' }}
        run: |
          git add -A -- host/node.json
          git diff --cached --binary --no-renames > "${RUNNER_TEMP}/bump.patch"
          git diff --cached --stat | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.decide.outputs.bump == 'true' && env.REAL_RUN == 'true' }}
        with:
          name: bump
          path: ${{ runner.temp }}/bump.patch
          if-no-files-found: error
          retention-days: 1

  open:
    name: Open the pull request
    needs: bump
    if: ${{ needs.bump.outputs.bump == 'true' && (github.event_name == 'schedule' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse any branch but main
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "::error::The host follows Node from main only, and this run is on ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump
          path: ${{ runner.temp }}/bump

      # The patch came from a job that ran code fetched from the network, so
      # it may change the pin and nothing else. What it staged is checked
      # after it is applied, path by path with no newline taken for a break
      # between two, and before anything is committed, by a copy of the check
      # made first, since the patch could change the script itself.
      - name: Apply the patch
        run: |
          check="${RUNNER_TEMP}/only-staged-paths.sh"
          cp scripts/only-staged-paths.sh "${check}"
          git apply --index "${RUNNER_TEMP}/bump/bump.patch"
          "${check}" host/node.json

      # Made only now. Contents write still reaches every branch and tag in
      # this repository, and nothing else in this job runs code it does not
      # control.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.bump.outputs.version }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          title="chore(host): follow node v${VERSION}"
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git commit -q -m "${title}"
          # The decision found no open pull request that moves the pin, so a
          # branch left by one closed by hand is nobody's.
          header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${header}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${header}" \
            git push -q --force origin "${BRANCH}"
          {
            echo "## Summary"
            echo
            echo "Moves the Node release the connector host carries to v${VERSION}, the newest release of its major version."
            echo
            echo "## Changes"
            echo
            echo "- \`host/node.json\` names v${VERSION} and, for each platform, the SHA-256 of its archive in that release's \`SHASUMS256.txt\`, whose signature was checked against the Node.js release keys."
            echo
            echo "## Testing"
            echo
            echo "The pin was written in this run after the signature check. The required checks run on this pull request in full, with the kit's tests and the connector bundles on v${VERSION}, and it merges when they pass. It adds no behavior of its own, so it adds no test."
            echo
            echo "## Notes for reviewers"
            echo
            echo "Opened by the \`Follow Node releases\` workflow. A pull request whose checks fail stays open and no second one is opened beside it."
            echo
            echo "## Checklist"
            echo
            echo "- [x] The title is a scoped Conventional Commit."
            echo "- [x] New behavior has a test that was seen failing first, or no test was needed and the reason is above."
            echo "- [x] Docs, comments and the contract still say what is true after this change."
          } > "${RUNNER_TEMP}/body.md"
          url="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH}" \
            --title "${title}" --body-file "${RUNNER_TEMP}/body.md")"
          gh pr merge "${url##*/}" --repo "${GITHUB_REPOSITORY}" --squash --auto --delete-branch

  report-failure:
    name: Report a failed scheduled run
    needs: [bump, open]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/report-scheduled-failure.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/report-scheduled-failure.sh
